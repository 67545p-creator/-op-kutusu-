<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onur AI Çöp Kutusu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      padding: 18px;
      background: #151515;
      border-bottom: 1px solid #292929;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    #login {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: #151515;
      padding: 25px;
      border-radius: 15px;
      border: 1px solid #292929;
    }

    .login-box h2 {
      margin-top: 0;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 9px;
      border: 1px solid #333;
      background: #0d0d0d;
      color: white;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      cursor: pointer;
      background: #1976ff;
      color: white;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .login-box button {
      width: 100%;
      margin-top: 15px;
    }

    #error {
      color: #ff5555;
      margin-top: 12px;
      text-align: center;
      display: none;
    }

    #panel {
      display: none;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .storage {
      background: #151515;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid #292929;
      margin-bottom: 20px;
    }

    .storage-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .bar {
      width: 100%;
      height: 14px;
      background: #292929;
      border-radius: 20px;
      overflow: hidden;
    }

    #barFill {
      height: 100%;
      width: 0%;
      background: #1976ff;
      transition: width .3s;
    }

    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chats {
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 15px;
    }

    .chat-list,
    .messages {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      overflow: hidden;
    }

    .chat-list {
      max-height: 650px;
      overflow-y: auto;
    }

    .chat-item {
      padding: 15px;
      border-bottom: 1px solid #292929;
      cursor: pointer;
    }

    .chat-item:hover {
      background: #202020;
    }

    .chat-id {
      font-weight: bold;
    }

    .chat-date {
      color: #888;
      font-size: 12px;
      margin-top: 5px;
    }

    .messages {
      min-height: 400px;
      padding: 15px;
      max-height: 650px;
      overflow-y: auto;
    }

    .message {
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      background: #17345f;
    }

    .assistant {
      background: #242424;
    }

    .role {
      font-size: 12px;
      color: #999;
      margin-bottom: 5px;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 40px 15px;
    }

    @media (max-width: 700px) {
      .chats {
        grid-template-columns: 1fr;
      }

      .chat-list {
        max-height: 300px;
      }

      .messages {
        max-height: 500px;
      }
    }
  </style>
</head>

<body>

  <div id="login">
    <div class="login-box">
      <h2>Onur AI Çöp Kutusu</h2>

      <input
        id="password"
        type="password"
        placeholder="Admin şifresi"
        autocomplete="off"
      >

      <button onclick="login()">Giriş Yap</button>

      <div id="error">
        Şifre yanlış.
      </div>
    </div>
  </div>


  <div id="panel">

    <header>
      <h1>Onur AI Çöp Kutusu</h1>
    </header>

    <div class="container">

      <div class="storage">

        <div class="storage-title">
          <strong>Depolama</strong>
          <span id="storageText">0 MB / 60 MB</span>
        </div>

        <div class="bar">
          <div id="barFill"></div>
        </div>

        <div class="actions">
          <button onclick="loadStorage()">Yenile</button>
          <button onclick="logout()">Çıkış Yap</button>
        </div>

        <p>
          Otomatik temizlik: <b>60 MB</b>'a ulaşınca eski sohbetlerden
          en az <b>20 MB</b> silinir.
        </p>

      </div>


      <div class="chats">

        <div class="chat-list" id="chatList">
          <div class="empty">
            Sohbetler yükleniyor...
          </div>
        </div>

        <div class="messages" id="messages">
          <div class="empty">
            Bir sohbet seç.
          </div>
        </div>

      </div>

    </div>

  </div>


<script>

let adminPassword = "";


async function login() {

  const password =
    document.getElementById("password").value.trim();

  if (!password) {
    return;
  }

  adminPassword = password;

  try {

    const response = await fetch("/admin/api/storage", {
      headers: {
        "x-admin-password": adminPassword
      }
    });

    if (!response.ok) {
      throw new Error("wrong");
    }

    document.getElementById("login").style.display = "none";
    document.getElementById("panel").style.display = "block";
    document.getElementById("error").style.display = "none";

    await loadStorage();
    await loadChats();

  } catch (error) {

    adminPassword = "";

    document.getElementById("error").style.display = "block";

  }
}


async function loadStorage() {

  try {

    const response = await fetch(
      "/admin/api/storage",
      {
        headers: {
          "x-admin-password": adminPassword
        }
      }
    );

    if (!response.ok) {
      logout();
      return;
    }

    const data = await response.json();

    const mb = Number(data.megabytes || 0);
    const limit = Number(data.limitMegabytes || 60);

    const percent =
      Math.min((mb / limit) * 100, 100);

    document.getElementById("storageText").textContent =
      mb.toFixed(2) + " MB / " + limit + " MB";

    document.getElementById("barFill").style.width =
      percent + "%";

  } catch (error) {

    console.error(error);

  }
}


async function loadChats() {

  const list =
    document.getElementById("chatList");

  try {

    const response = await fetch(
      "/admin/api/chats",
      {
        headers: {
          "x-admin-password": adminPassword
        }
      }
    );

    if (!response.ok) {
      logout();
      return;
    }

    const data = await response.json();

    const chats = Array.isArray(data)
      ? data
      : (data.chats || []);

    list.innerHTML = "";

    if (chats.length === 0) {

      list.innerHTML =
        '<div class="empty">Henüz sohbet yok.</div>';

      return;
    }

    chats.forEach(chat => {

      const item =
        document.createElement("div");

      item.className = "chat-item";

      item.innerHTML = `
        <div class="chat-id">
          ${escapeHTML(chat.id || "Bilinmeyen")}
        </div>

        <div class="chat-date">
          ${formatDate(chat.updatedAt || chat.createdAt)}
        </div>
      `;

      item.onclick = () =>
        openChat(chat.id);

      list.appendChild(item);

    });

  } catch (error) {

    list.innerHTML =
      '<div class="empty">Sohbetler alınamadı.</div>';

  }
}


async function openChat(chatId) {

  const box =
    document.getElementById("messages");

  box.innerHTML =
    '<div class="empty">Yükleniyor...</div>';

  try {

    const response = await fetch(
      "/admin/api/chat/" +
      encodeURIComponent(chatId),
      {
        headers: {
          "x-admin-password": adminPassword
        }
      }
    );

    if (!response.ok) {
      box.innerHTML =
        '<div class="empty">Sohbet alınamadı.</div>';
      return;
    }

    const data = await response.json();

    const chat = data.chat || data;

    box.innerHTML = "";

    const messages =
      Array.isArray(chat.messages)
        ? chat.messages
        : [];

    if (messages.length === 0) {

      box.innerHTML =
        '<div class="empty">Bu sohbet boş.</div>';

      return;
    }

    messages.forEach(message => {

      const div =
        document.createElement("div");

      const role =
        message.role || "unknown";

      div.className =
        "message " +
        (role === "user"
          ? "user"
          : "assistant");

      const roleText =
        role === "user"
          ? "Kullanıcı"
          : "Onur AI";

      div.innerHTML = `
        <div class="role">
          ${roleText}
        </div>

        <div>
          ${escapeHTML(
            message.content ??
            message.text ??
            ""
          )}
        </div>
      `;

      box.appendChild(div);

    });

    box.scrollTop = box.scrollHeight;

  } catch (error) {

    box.innerHTML =
      '<div class="empty">Hata oluştu.</div>';

  }
}


function logout() {

  adminPassword = "";

  document.getElementById("panel").style.display =
    "none";

  document.getElementById("login").style.display =
    "flex";

  document.getElementById("password").value =
    "";

  document.getElementById("messages").innerHTML =
    '<div class="empty">Bir sohbet seç.</div>';
}


function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function formatDate(date) {

  if (!date) {
    return "";
  }

  try {

    return new Date(date).toLocaleString("tr-TR");

  } catch {

    return String(date);

  }
}


document
  .getElementById("password")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      login();
    }

  });

</script>

</body>
  </html>
